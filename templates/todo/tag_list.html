{% extends 'base.html' %}

{% block content %}
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Tags</h2>
    <button type="button" class="btn btn-primary" data-bs-toggle="modal"
            data-bs-target="#tagModal" data-tag-name="" data-tag-id="">
      + Add Tag
    </button>
  </div>

  {% if tag_list %}
    <div class="list-group">
      {% for tag in tag_list %}
        <div
            class="list-group-item d-flex justify-content-between align-items-center">
          <span>{{ tag.name }}</span>
          <button
              type="button"
              class="btn btn-sm btn-outline-secondary"
              data-bs-toggle="modal"
              data-bs-target="#tagModal"
              data-tag-name="{{ tag.name }}"
              data-tag-id="{{ tag.id }}">
            Edit
          </button>
        </div>
      {% endfor %}
    </div>
  {% else %}
    <p class="text-muted">No tags yet.</p>
  {% endif %}

  <div class="modal fade" id="tagModal" tabindex="-1"
       aria-labelledby="tagModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form method="POST" id="tagForm"
              action="#">
          {% csrf_token %}
          <input type="hidden" name="tag_id" id="tagIdInput">
          <div class="modal-header">
            <h5 class="modal-title" id="tagModalLabel">Add Tag</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"
                    aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label for="tagNameInput" class="form-label">Tag name</label>
              <input type="text" class="form-control" id="tagNameInput"
                     name="name" required>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary"
                    data-bs-dismiss="modal">Cancel
            </button>
            <button type="submit" class="btn btn-primary">Save Tag</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script>
      const tagModal = document.getElementById('tagModal');
      tagModal.addEventListener('show.bs.modal', event => {
          const button = event.relatedTarget;
          const tagName = button.getAttribute('data-tag-name');
          const tagId = button.getAttribute('data-tag-id');

          const modalTitle = tagModal.querySelector('.modal-title');
          const nameInput = tagModal.querySelector('#tagNameInput');
          const idInput = tagModal.querySelector('#tagIdInput');

          if (tagId) {
              modalTitle.textContent = 'Edit Tag';
              nameInput.value = tagName;
              idInput.value = tagId;
          } else {
              modalTitle.textContent = 'Add Tag';
              nameInput.value = '';
              idInput.value = '';
          }
      });
  </script>
{% endblock %}

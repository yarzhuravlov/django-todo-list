{% extends 'base.html' %}

{% block content %}
  <div class="container mt-5">
    <div class="card border-danger shadow-sm">
      <div class="card-header bg-danger text-white">
        Confirm Tag Deletion
      </div>
      <div class="card-body">
        <h5 class="card-title">Are you sure you want to delete the tag <strong>"{{ object.name }}"</strong>?
        </h5>
        <p class="card-text">
          This tag is currently used by
          <strong>{{ object.tasks.count }}</strong>
          task{{ object.tasks.count|pluralize }}.
        </p>
        <form method="post">
          {% csrf_token %}
          <a href="{% url 'todo:tag-list' %}"
             class="btn btn-secondary">Cancel</a>
          <button type="submit" class="btn btn-danger">Yes, Delete</button>
        </form>
      </div>
    </div>
  </div>
{% endblock %}

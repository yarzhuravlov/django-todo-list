<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}ToDo{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7"
      crossorigin="anonymous">

  {% block extra_head %}{% endblock %}
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-3">
  <div class="container-fluid">
    <a class="navbar-brand" href="{% url 'todo:task-list' %}">📝 ToDo</a>
  </div>
</nav>

<!-- Page content layout -->
<div class="container-fluid">
  <div class="row">
    <!-- Sidebar (optional future) -->
    <div
        class="col-md-3 col-lg-2 d-none d-md-block bg-light border-end min-vh-100"
        id="sidebar">
      <div class="d-flex flex-column p-3">
        <h5 class="mb-4">Navigation</h5>
        <ul class="nav nav-pills flex-column">
          <li class="nav-item mb-2">
            <a href="{% url 'todo:task-list' %}"
               class="nav-link link-dark {% if request.resolver_match.url_name == 'task-list' %}active{% endif %}">
              📋 Tasks
            </a>
          </li>
          <li class="nav-item mb-2">
            <a href="{% url 'todo:tag-list' %}"
               class="nav-link link-dark {% if request.resolver_match.url_name == 'tag-list' %}active{% endif %}">
              🏷️ Tags
            </a>
          </li>
        </ul>
      </div>
    </div>


    <!-- Main content -->
    <div class="col-md-9 col-lg-10 px-4">
      {% block content %}
        <!-- Main content will be injected here -->
      {% endblock %}
    </div>
  </div>
</div>

<!-- Optional footer -->
<footer class="mt-auto py-3 bg-dark text-light text-center">
  <div class="container">
    <small>&copy; 2025 Your ToDo App</small>
  </div>
</footer>

<!-- Bootstrap JS -->
<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
    crossorigin="anonymous"></script>
</body>
</html>
